<div class="app-container" [attr.data-theme]="placesService.theme()">
  <!-- Desktop Navigation Sidebar -->
  <app-side-nav></app-side-nav>

  <!-- Main Content Viewport -->
  <div class="main-viewport">
    <app-header></app-header>

    <main class="content-view-area">
      @switch (placesService.currentView()) {
        @case ('map') {
          <app-map-view></app-map-view>
        }
        @case ('list') {
          <app-place-list></app-place-list>
        }
        @case ('detail') {
          <app-place-detail></app-place-detail>
        }
        @case ('review') {
          <app-review-modal></app-review-modal>
        }
      }
    </main>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <app-bottom-nav></app-bottom-nav>
</div>
